# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: maf-agent-go-04
services:
    bruno-byok03:
        host: azure.ai.project
        endpoint: https://bruno-byok03-resource.services.ai.azure.com/api/projects/bruno-byok03
    maf-agent-go-04:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        uses:
            - bruno-byok03
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: maf-agent-go-04
        protocols:
            - protocol: invocations
              version: 2.0.0
infra:
    provider: microsoft.foundry
