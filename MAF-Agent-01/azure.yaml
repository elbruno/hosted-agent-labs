# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: maf-agent-01
services:
    bruno-byok-02:
        host: azure.ai.project
        endpoint: https://bruno-byok-02-resource.services.ai.azure.com/api/projects/bruno-byok-02
    maf-agent-01:
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - bruno-byok-02
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: MAF-Agent-01.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: maf-agent-01
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
